<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180" role="img" aria-labelledby="title desc">
  <title id="title">Shadowrocket round icon</title>
  <desc id="desc">Blue-to-purple rocket mark on a circular white background with transparent corners.</desc>
  <defs>
    <linearGradient id="rocketGradient" x1="90" y1="21" x2="90" y2="159" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#38b9e9"/>
      <stop offset="0.5" stop-color="#668eea"/>
      <stop offset="1" stop-color="#9a55df"/>
    </linearGradient>
  </defs>

  <!-- Circular white background; everything beyond it remains transparent. -->
  <circle cx="90" cy="90" r="90" fill="#fff"/>

  <!-- Rocket body and fins. -->
  <path
    d="M90 23.5
       C72.6 36.6 62.6 58.2 62.6 82.5
       C55.2 90.2 51.2 101.4 51.2 115.3
       L75.9 111.2
       C78.5 117.8 83.2 121.1 90 121.1
       C96.8 121.1 101.5 117.8 104.1 111.2
       L128.8 115.3
       C128.8 101.4 124.8 90.2 117.4 82.5
       C117.4 58.2 107.4 36.6 90 23.5 Z"
    fill="#fff"
    stroke="url(#rocketGradient)"
    stroke-width="6"
    stroke-linecap="round"
    stroke-linejoin="round"/>

  <!-- Window. -->
  <circle cx="90" cy="64.2" r="10.2" fill="#fff" stroke="url(#rocketGradient)" stroke-width="5.5"/>

  <!-- Exhaust flame. -->
  <path
    d="M90 130.1
       C83.7 134.6 82.5 140.2 84.9 146.4
       C86.2 149.8 88.1 153.2 90 156.7
       C91.9 153.2 93.8 149.8 95.1 146.4
       C97.5 140.2 96.3 134.6 90 130.1 Z"
    fill="#fff"
    stroke="url(#rocketGradient)"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"/>
</svg>
