<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Gradient cat icon</title>
  <desc id="desc">A white stylized cat face on a circular pink, purple, and blue gradient.</desc>
  <defs>
    <linearGradient id="background" x1="256" y1="0" x2="256" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fa72b2"/>
      <stop offset="0.48" stop-color="#c765ec"/>
      <stop offset="1" stop-color="#7b7ff5"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(286 91) rotate(90) scale(287 323)">
      <stop stop-color="#ff83ba" stop-opacity=".55"/>
      <stop offset="1" stop-color="#c05eff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- The canvas outside the circle is transparent. -->
  <circle cx="256" cy="256" r="256" fill="url(#background)"/>
  <circle cx="256" cy="256" r="256" fill="url(#glow)"/>

  <!-- Cat head, ears and cheeks. -->
